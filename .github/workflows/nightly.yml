name: nightly-exploration

# Runs the example simulations with many more seeds from a random start.
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Explore 20x more seeds
        run: ./gradlew :examples:expense-ledger:test :examples:offline-tasks:test :examples:collab-text:test :examples:ktor-sync:test -Psynclab.native=false
        env:
          SYNCLAB_RUNS: "4000"
          SYNCLAB_FIRST_SEED: random
      - name: Benchmarks
        run: ./gradlew :benchmarks:run -Psynclab.native=false
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: synclab-reports, path: "**/build/synclab-reports/" }
